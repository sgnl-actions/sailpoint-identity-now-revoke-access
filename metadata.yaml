# yaml-language-server: $schema=https://raw.githubusercontent.com/sgnl-actions/schemas/main/metadata.schema.json
name: sailpoint-identity-now-revoke-access
description: Request to revoke access to resources in SailPoint IdentityNow

# Input parameters for web form generation
inputs:
  identityId:
    type: text
    description: The ID of the identity requesting access
    required: true
    validation:
      min: 1
      max: 255

  itemType:
    type: text
    description: Type of access item (ACCESS_PROFILE, ROLE, or ENTITLEMENT)
    required: true
    validation:
      enum: ["ACCESS_PROFILE", "ROLE", "ENTITLEMENT"]

  itemId:
    type: text
    description: The ID of the access item to grant
    required: true
    validation:
      min: 1
      max: 255

  itemComment:
    type: text
    description: Comment for the access revocation request (required for revoke)
    required: true
    validation:
      max: 1000

  address:
    type: text
    description: Optional SailPoint IdentityNow API base URL override
    required: false
    validation:
      min: 1
      max: 100

  itemRemoveDate:
    type: text
    description: ISO 8601 date when access should be removed
    required: false
    validation:
      max: 100

  clientMetadata:
    type: text
    description: Optional arbitrary key-value pairs represented as an encoded JSON string
    required: false

  itemClientMetadata:
    type: text
    description: Optional arbitrary key-value pairs represented as an encoded JSON string
    required: false

# Expected output structure
outputs:
  requestId:
    type: text
    description: The ID of the access request created

  identityId:
    type: text
    description: The identity ID for which access was requested

  itemType:
    type: text
    description: The type of access item requested

  itemId:
    type: text
    description: The ID of the access item requested

  status:
    type: text
    description: The status of the access request

  requestedAt:
    type: datetime
    description: When the access request was created (ISO 8601)

  address:
    type: text
    description: The SailPoint IdentityNow API base URL used

environment:
  ADDRESS:
    type: text
    description: Base URL for the API
    required: false
  OAUTH2_CLIENT_CREDENTIALS_AUDIENCE:
    type: text
    description: OAuth2 client credentials audience
    required: false
  OAUTH2_CLIENT_CREDENTIALS_AUTH_STYLE:
    type: text
    description: OAuth2 client credentials auth style
    required: false
  OAUTH2_CLIENT_CREDENTIALS_CLIENT_ID:
    type: text
    description: OAuth2 client credentials client ID
    required: false
  OAUTH2_CLIENT_CREDENTIALS_SCOPE:
    type: text
    description: OAuth2 client credentials scope
    required: false
  OAUTH2_CLIENT_CREDENTIALS_TOKEN_URL:
    type: text
    description: OAuth2 client credentials token URL
    required: false

secrets:
  BEARER_AUTH_TOKEN:
    type: text
    description: Bearer auth token
    required: false
  BASIC_USERNAME:
    type: text
    description: Basic auth username
    required: false
  BASIC_PASSWORD:
    type: text
    description: Basic auth password
    required: false
  OAUTH2_CLIENT_CREDENTIALS_CLIENT_SECRET:
    type: text
    description: OAuth2 client secret
    required: false
  OAUTH2_AUTHORIZATION_CODE_ACCESS_TOKEN:
    type: text
    description: OAuth2 authorization code access token
    required: false

optional_one_of:
  - ["secrets.BEARER_AUTH_TOKEN"]
  - ["secrets.BASIC_USERNAME", "secrets.BASIC_PASSWORD"]
  - [
      "secrets.OAUTH2_CLIENT_CREDENTIALS_CLIENT_SECRET",
      "environment.OAUTH2_CLIENT_CREDENTIALS_CLIENT_ID",
      "environment.OAUTH2_CLIENT_CREDENTIALS_TOKEN_URL",
    ]
  - ["secrets.OAUTH2_AUTHORIZATION_CODE_ACCESS_TOKEN"]
